<script type="text/javascript">

function sendPoints()
{
var ids = new Array ("xx", "hh", "yy", "d1");
var arg = ""; var entry = ""; var valid = true;

for (i in ids)
{
entry = document.getElementById(ids[i]).value
if ((entry.length == 0) || isNaN(entry))
{
valid = false;
}
else
{
arg = arg + entry + ",";
}
}

if (!valid)
{
arg = "";
}
window.location = "skp:sok@" + arg ;
}
</script>
